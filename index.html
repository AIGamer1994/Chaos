<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>群魔 Chaos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 牌桌 A–F 區介面設定（複製自狼月 theme.js，另加 UI.CH 群魔專用樣式）：改外觀請編輯 chaos-theme.js -->
    <script src="chaos-theme.js"></script>
    <!-- 群魔規則引擎（純規則，無畫面）：改規則請編輯 chaos-engine.js -->
    <script src="chaos-engine.js"></script>
    <style>
        * { -webkit-touch-callout: none !important; -webkit-user-select: none !important; user-select: none !important; touch-action: manipulation; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        html, body, #root { height: 100%; margin: 0; background: #020617; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
const { useState, useEffect, useLayoutEffect, useRef, useContext } = React;
const PeekCtx = React.createContext(null); // 任何彈窗中的牌都可點開看詳情
const E = window.ChaosEngine;
const VERSION = '群魔 v0.1.0';
const STAGE_W = 405, STAGE_H = 720;
const HUMAN = 0;
const NAMES = ['你', '青鸞', '白澤', '玄武', '朱雀', '麒麟'];
const GRADS = ['from-emerald-400 to-teal-600', 'from-sky-400 to-blue-600', 'from-rose-400 to-red-600', 'from-amber-300 to-orange-600', 'from-violet-400 to-purple-600', 'from-pink-400 to-fuchsia-600'];
const GUIDE = {};
Object.values(E.CARD_GUIDE).forEach(g => { GUIDE[g.id] = g; });
const GUIDE_BY_NAME = {};
Object.values(E.CARD_GUIDE).forEach(g => { GUIDE_BY_NAME[g.n] = g; });
const sym = c => (c && E.SUIT_SYMBOLS[c.suit]) || '';
const suitCls = c => (c.suit === 'heart' || c.suit === 'diamond' || c.id === 'RED_JOKER') ? UI.CH.red
    : (c.suit === 'spade' || c.suit === 'club' || c.id === 'BLUE_JOKER') ? UI.CH.blue : UI.CH.neutral;
const isJoker = c => c.id === 'RED_JOKER' || c.id === 'BLUE_JOKER';
const targetable = p => p.hand.filter(c => !isJoker(c));
const frontSum = p => p.front.reduce((s, c) => s + (c.v || 0), 0);

// 花色用 SVG 繪製（比文字符號容易精準置中）：數字疊在它正中央
const SUIT_PATH = {
    heart: 'M50 92 C20 68 5 50 5 31 C5 16 16 7 28 7 C38 7 46 13 50 21 C54 13 62 7 72 7 C84 7 95 16 95 31 C95 50 80 68 50 92 Z',
    diamond: 'M50 3 L90 50 L50 97 L10 50 Z',
    spade: 'M50 4 C50 4 94 34 94 60 C94 75 83 84 71 84 C63 84 56 80 53 74 C54 83 58 90 66 96 L34 96 C42 90 46 83 47 74 C44 80 37 84 29 84 C17 84 6 75 6 60 C6 34 50 4 50 4 Z',
    club: 'M50 6 A22 22 0 1 1 50 50 A22 22 0 1 1 50 6 Z M27 40 A22 22 0 1 1 27 84 A22 22 0 1 1 27 40 Z M73 40 A22 22 0 1 1 73 84 A22 22 0 1 1 73 40 Z M50 50 C50 76 46 88 34 96 L66 96 C54 88 50 76 50 50 Z',
    star: 'M50 4 L61 38 L96 38 L67 59 L78 94 L50 73 L22 94 L33 59 L4 38 L39 38 Z'
};
function SuitIcon({ c, className }) {
    return <svg className={className} viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d={SUIT_PATH[c.suit] || SUIT_PATH.star} /></svg>;
}
// 依「花式 → 數值 → 牌名」顯示（叫糊列表、規則列用；無花式則略過）
function cardLabelParts(nameOrCard) {
    if (nameOrCard && typeof nameOrCard === 'object') {
        const c = nameOrCard;
        const suit = isJoker(c) ? <span className={suitCls(c)}>✦</span> : (sym(c) ? <span className={suitCls(c)}>{sym(c)}</span> : null);
        return { suit, v: c.v, n: c.n };
    }
    const name = nameOrCard;
    const gd = GUIDE_BY_NAME[name] || {};
    const d = E.CARD_DEFS.find(x => x.n === name || x.id === gd.id);
    if (!d) {
        if (name === '紅小丑') return { suit: <span className={UI.CH.red}>✦</span>, v: 0, n: name };
        if (name === '藍小丑') return { suit: <span className={UI.CH.blue}>✦</span>, v: 0, n: name };
        if (['月亮', '南瓜', '鮮血'].includes(name)) return { suit: <span className="text-slate-500">道具</span>, v: null, n: name };
        return { suit: null, v: null, n: name };
    }
    if (d.id === 'ZOMBIE' || d.id === 'SKELETON') {
        return { suit: <><span className={UI.CH.blue}>♠♣</span><span className={UI.CH.red}>♥♦</span></>, v: d.v, n: name };
    }
    return { suit: <span className={suitCls(d)}>{sym(d)}</span>, v: d.v, n: name };
}
function CardLabel({ name, card, className }) {
    const p = cardLabelParts(card || name);
    return (
        <span className={className || 'inline-flex items-center gap-0.5'}>
            {p.suit && <span className="shrink-0">{p.suit}</span>}
            {p.v != null && <span className="gothic-num shrink-0">{p.v}</span>}
            <span className="min-w-0">{p.n}</span>
        </span>
    );
}
function Chip({ c, onClick, hl }) {
    const peek = useContext(PeekCtx);
    const cls = UI.CH.chip + (hl ? ' ' + UI.CH.chipHl : '');
    const body = ( // 花式 → 數值 → 牌名
        <>
            <span className={suitCls(c)}>{sym(c) || (isJoker(c) ? '✦' : '')}</span>
            <span className={'gothic-num ' + UI.CH.chipNum}>{c.v}</span>
            <span className={UI.CH.chipName}>{c.n}</span>
        </>
    );
    if (!onClick) return <button onClick={() => peek && peek(c)} className={cls}>{body}</button>;
    return ( // 可選取的牌：另附 i 鈕看詳情
        <span className="inline-flex items-center gap-[1px] shrink-0 max-w-full">
            <button onClick={onClick} className={cls}>{body}</button>
            <button onClick={e => { e.stopPropagation(); peek && peek(c); }} className="w-[14px] h-[18px] rounded border border-slate-500/60 bg-slate-800/90 text-[9px] leading-none text-slate-300 active:scale-95">i</button>
        </span>
    );
}
// 小牌（與面前區同款 cards.jpg 牌面；back = 牌背 cardb.jpg）：用於暗牌／備用牌／棄牌堆／效果選牌
function SmallCard({ c, back, onClick, label, hl, sub }) {
    const peek = useContext(PeekCtx);
    const sz = { width: 72, height: 96 };
    if (back) return <button style={sz} onClick={onClick} className="card-back shrink-0 flex items-center justify-center text-amber-200/90 text-lg font-black shadow active:scale-95">{label || ''}</button>;
    return (
        <button style={sz} onClick={onClick || (() => peek && peek(c))}
            className={'front-card-bg bg-slate-900 shrink-0 shadow flex flex-col items-center justify-center gap-0.5 px-0.5 py-1 active:scale-95 relative' + (hl ? ' front-card-active' : '')}>
            <span className={UI.E.e55}>{c.v}</span>
            <span className={'text-2xl ' + suitCls(c)}>{sym(c) || '✦'}</span>
            <span className={UI.E.e57}>{c.n}</span>
            {sub && <span className="absolute bottom-0.5 left-0 right-0 text-center text-[8px] font-black text-emerald-300 leading-none px-0.5 truncate">{sub}</span>}
        </button>
    );
}
// 對手面前區：cards.jpg 牌面疊放；前面的牌只露出上方摺疊條（數字＋花式＋牌名），最後一張完整顯示
function OppFront({ cards, cs }) {
    const peek = useContext(PeekCtx);
    const n = cards.length;
    if (!n) return <span className={UI.CH.oppEmpty}>—</span>;
    const step = n <= 1 ? 0 : Math.max(11, Math.min(17, Math.floor(54 / (n - 1))));
    return (
        <div className="relative w-full max-w-[72px] mx-auto" style={{ height: (n - 1) * step + 96 }}>
            {cards.map((c, i) => {
                const last = i === n - 1, hl = cs.has(c.uid) ? ' front-card-active' : '';
                if (last) return (
                    <button key={c.uid || i} data-uid={c.uid} onClick={() => peek && peek(c)} style={{ top: i * step, height: 96, zIndex: i }}
                        className={'absolute left-0 w-full front-card-bg bg-slate-900 shadow flex flex-col items-center justify-center gap-0.5 px-0.5 py-1 active:scale-95' + hl}>
                        <span className={UI.E.e55}>{c.v}</span>
                        <span className={'text-2xl ' + suitCls(c)}>{sym(c) || '✦'}</span>
                        <span className={UI.E.e57}>{c.n}</span>
                    </button>
                );
                return (
                    <button key={c.uid || i} data-uid={c.uid} onClick={() => peek && peek(c)} style={{ top: i * step, height: step + 3, zIndex: i }}
                        className={'absolute left-0 w-full front-card-top bg-slate-900 shadow flex items-center overflow-hidden active:scale-95' + hl}>
                        <span className="shrink-0 flex items-center gap-[2px] gothic-num font-black text-amber-300 text-[10px] leading-none pl-[15px]"><span className={'text-[9px] ' + suitCls(c)}>{sym(c) || '✦'}</span>{c.v}</span>
                        <span className={'flex-1 min-w-0 text-left font-black text-amber-100 leading-none whitespace-nowrap overflow-hidden pl-[2px] pr-[12px] ' + (c.n.length >= 4 ? 'text-[7px] tracking-[-0.4px]' : c.n.length === 3 ? 'text-[8px]' : 'text-[9px]')}>{c.n}</span>
                    </button>
                );
            })}
        </div>
    );
}
const BackCtx = React.createContext(null); // 選擇彈窗的「返回上一步」
function Modal({ title, onClose, children }) {
    const back = useContext(BackCtx);
    return (
        <div className={UI.CH.m01} onClick={onClose}>
            <div className={UI.CH.m02} onClick={e => e.stopPropagation()}>
                {title && <div className={UI.CH.m03}>{title}</div>}
                {children}
                {back && !onClose && <button className={UI.CH.btnGhost + ' mt-2 w-full'} onClick={back}>↩ 返回上一步</button>}
                {onClose && <button className={UI.CH.btnGhost + ' mt-2 w-full'} onClick={onClose}>關閉</button>}
            </div>
        </div>
    );
}
// 手牌同款底圖（card.jpg／特殊角色圖）；用於詳情放大檢視
function cardSkinClass(c) {
    if (!c) return '';
    const id = c.id, n = c.n;
    if (id === 'WEREWOLF' || n === '狼人') return 'card-bg-wolf';
    if (id === 'VAMPIRE' || n === '吸血鬼') return 'card-bg-vamp';
    if (id === 'WITCH' || n === '女巫') return 'card-bg-witch';
    if (id === 'FRANKENSTEIN' || n === '科學怪人') return 'card-bg-frank';
    return '';
}
function resolveCardForZoom(cOrName) {
    if (cOrName && typeof cOrName === 'object' && (cOrName.id || cOrName.n)) {
        const c = { ...cOrName };
        if (!c.id && c.n) c.id = (GUIDE_BY_NAME[c.n] || {}).id;
        if (c.suit == null && c.id) {
            const d = E.CARD_DEFS.find(x => x.id === c.id);
            if (d && d.suit) c.suit = d.suit;
        }
        if (c.v == null && c.id) {
            const d = E.CARD_DEFS.find(x => x.id === c.id);
            if (d) c.v = d.v;
            else if (E.SPECIALS && Object.values(E.SPECIALS).some(s => s.id === c.id)) c.v = 0;
        }
        return c;
    }
    const name = cOrName;
    const gd = GUIDE_BY_NAME[name] || {};
    const d = E.CARD_DEFS.find(x => x.n === name || x.id === gd.id);
    if (d) return { ...d, n: d.n };
    if (name === '紅小丑') return { id: 'RED_JOKER', n: '紅小丑', v: 0 };
    if (name === '藍小丑') return { id: 'BLUE_JOKER', n: '藍小丑', v: 0 };
    if (['月亮', '南瓜', '鮮血'].includes(name)) {
        const id = name === '月亮' ? 'MOON' : name === '南瓜' ? 'PUMPKIN' : 'BLOOD';
        return { id, n: name, v: 0 };
    }
    return { id: gd.id, n: name, v: 0 };
}
function ZoomCard({ c }) {
    const card = resolveCardForZoom(c);
    const gd = GUIDE[card.id] || GUIDE_BY_NAME[card.n] || {};
    const vStr = String(card.v != null ? card.v : '');
    const two = vStr.length > 1;
    return (
        <div className={'hand-card card-bg ' + cardSkinClass(card) + ' relative w-[150px] h-[200px] bg-slate-900 p-2.5 flex flex-col justify-between shrink-0 mx-auto shadow-2xl pointer-events-none'}>
            <div className={UI.F.f40}>
                <SuitIcon c={card} className={'cd-s ' + suitCls(card) + (two ? ' two' : '')} />
                <span className={UI.F.f41({ isSelected: false }) + (two ? ' two' : '')}>{card.v}</span>
            </div>
            <div className={UI.F.f45}>{card.n}</div>
            <div className={UI.F.f44}><div className={UI.F.f46}>{gd.effect || gd.victory || ''}</div></div>
        </div>
    );
}
function CardDetail({ c, after, onClose }) {
    const card = resolveCardForZoom(c);
    const gd = GUIDE[card.id] || GUIDE_BY_NAME[card.n] || {};
    const title = `${sym(card) || (isJoker(card) ? '✦' : '')} ${card.v} ${card.n}`.replace(/^\s+/, '');
    return (
        <Modal title={title} onClose={onClose}>
            <div className="flex justify-center my-2"><ZoomCard c={card} /></div>
            {gd.victory && <div className={UI.CH.m04}><b className="text-amber-300">勝利條件：</b>{gd.victory}</div>}
            {gd.effect && <div className={UI.CH.m04}><b className="text-fuchsia-300">效果：</b>{gd.effect}</div>}
            {after && after.length > 0 && (
                <div className={UI.CH.tenpaiText}>
                    打出後會額外叫糊：
                    {after.map((n, i) => <span key={n}>{i > 0 && '、'}<span className={UI.CH.tenpaiName}><CardLabel name={n} /></span></span>)}
                </div>
            )}
        </Modal>
    );
}
function GuideModal({ name, onClose }) {
    const gd = GUIDE_BY_NAME[name] || {};
    const card = resolveCardForZoom(name);
    return (
        <Modal title={<CardLabel name={name} className="inline-flex items-center gap-1" />} onClose={onClose}>
            <div className="flex justify-center my-2"><ZoomCard c={card} /></div>
            {gd.victory && <div className={UI.CH.m04}><b className="text-amber-300">勝利條件：</b>{gd.victory}</div>}
            {gd.effect && <div className={UI.CH.m04}><b className="text-fuchsia-300">效果：</b>{gd.effect}</div>}
        </Modal>
    );
}
function TenpaiNames({ names, onPick }) {
    // 一行一張，不用頓號連接
    return (
        <span className="inline-flex flex-col items-start gap-0.5 align-top">
            {names.map(n => (
                <span key={n} className={UI.CH.tenpaiName + ' block'} onClick={() => onPick(n)}>
                    <CardLabel name={n} />
                </span>
            ))}
        </span>
    );
}
function NumPad({ g, picks, onPick }) { // 1–13 只顯示一次；picks 為已選順序（第 1 個、第 2 個）；每格列出尚未出現的牌
    const left = E.unplayedCards(g, g.players[HUMAN]);
    return (
        <div className="grid grid-cols-4 gap-1.5 my-2">
            {Array.from({ length: 13 }, (_, k) => k + 1).map(i => {
                const names = left.filter(o => o.value === i);
                const order = picks.indexOf(i);
                const on = order >= 0;
                return (
                    <button key={i} onClick={() => onPick(i)}
                        className={`relative min-h-[52px] rounded-md border px-1 py-1 flex flex-col items-center justify-center active:scale-95 ${on ? 'bg-amber-500 border-amber-200 text-slate-950' : 'bg-slate-800/90 border-slate-600 text-slate-200'} ${names.length === 0 && !on ? 'opacity-45' : ''}`}>
                        {on && <span className="absolute top-0.5 right-1 text-[9px] font-black text-slate-950 bg-white/80 rounded-full w-[14px] h-[14px] leading-[14px] text-center">{order + 1}</span>}
                        <span className="gothic-num text-[15px] font-black leading-none">{i}</span>
                        <span className={`mt-0.5 text-[8.5px] leading-tight text-center ${on ? 'text-slate-900' : 'text-slate-400'}`}>{names.length ? names.map(o => o.name + (o.count > 1 ? '×' + o.count : '')).join('、') : '—'}</span>
                    </button>
                );
            })}
        </div>
    );
}
// 點數選擇：第 1 下 = 第一個數值，第 2 下 = 第二個數值；再點已選的數值＝取消；已選滿 2 個再點＝重新開始
const nextPicks = (picks, v) => picks.includes(v) ? picks.filter(x => x !== v) : picks.length >= 2 ? [v] : [...picks, v];
function PlayerBtns({ g, ids, onPick }) {
    return (
        <div className={UI.CH.m05}>
            {ids.map(id => <button key={id} className={UI.CH.btnTarget} onClick={() => onPick(id)}>{g.players[id].name}</button>)}
        </div>
    );
}
function FrontPicker({ g, entries, onPick, previewAdd }) { // entries: [{playerId, index}]；previewAdd＝選中後會放到自己面前，可預覽叫糊綠框
    const me = g.players[HUMAN];
    const ids = [...new Set(entries.map(e => e.playerId))];
    return (
        <div>
            {ids.map(pid => (
                <div key={pid}>
                    <div className={UI.CH.sectionTitle}>{g.players[pid].name} 面前</div>
                    <div className={UI.CH.m05 + ' !flex-wrap'}>
                        {entries.filter(e => e.playerId === pid).map(e => {
                            const c = g.players[pid].front[e.index];
                            const extra = previewAdd ? E.tenpaiIfAddFront(g, me, c) : [];
                            const hl = extra.length > 0;
                            return (
                                <div key={e.index} className="flex flex-col items-center gap-0.5">
                                    <SmallCard c={c} hl={hl} onClick={() => onPick(pid, e.index)}
                                        sub={hl ? '叫糊+' + extra.length : null} />
                                    {hl && <span className="text-[8px] text-emerald-300 max-w-[72px] text-center leading-tight">{extra.map(n => cardLabelParts(n).n).join('、')}</span>}
                                </div>
                            );
                        })}
                    </div>
                </div>
            ))}
        </div>
    );
}
function UnplayedHint({ g }) { // 尚未公開的牌（扣除棄牌、所有面前牌及你的手牌）
    const list = E.unplayedCards(g, g.players[HUMAN]);
    const peek = useContext(PeekCtx);
    return (
        <div className="rounded-md bg-slate-800/80 border border-slate-600/60 p-1.5 my-1.5">
            <div className="text-[10px] font-black text-amber-300">尚未公開的牌（扣除棄牌、面前牌及你的手牌）</div>
            <div className="flex flex-wrap gap-[3px] mt-1">
                {list.length === 0 ? <span className={UI.CH.oppEmpty}>沒有可列出的牌</span>
                    : list.map(o => {
                        const parts = cardLabelParts(o.name);
                        return (
                            <button key={o.name + o.value} onClick={() => peek && peek({ id: (GUIDE_BY_NAME[o.name] || {}).id, n: o.name, v: o.value })}
                                className="text-[9px] leading-none rounded border border-slate-600/70 bg-slate-900/85 px-1 py-[3px] text-amber-200 active:scale-95 inline-flex items-center gap-0.5">
                                {parts.suit}<span className="gothic-num">{parts.v}</span>{parts.n}<span className="text-slate-400">×{o.count}</span>
                            </button>
                        );
                    })}
            </div>
        </div>
    );
}
function SkeletonDialog({ g, pr, ans }) {
    const [t, setT] = useState(pr.targets[0]);
    const [picks, setPicks] = useState([]);
    return (
        <Modal title="骷髏的猜測">
            <div className={UI.CH.m04}>選一位玩家，依序點選兩個手牌點數 (1–13，格內是尚未出現的牌)；任一猜中其非小丑手牌，就把該牌搶到自己面前。對方只有小丑時效果不觸發。</div>
            <PlayerBtns g={g} ids={pr.targets} onPick={setT} />
            <div className={UI.CH.m04}>目標：<b className="text-sky-300">{g.players[t].name}</b>　第一個：<b className="text-amber-300">{picks[0] ?? '—'}</b>　第二個：<b className="text-amber-300">{picks[1] ?? '—'}</b></div>
            <NumPad g={g} picks={picks} onPick={v => setPicks(p => nextPicks(p, v))} />
            <button className={UI.CH.btn + ' w-full'} disabled={picks.length < 2} onClick={() => ans({ targetId: t, guesses: [picks[0], picks[1]] })}>確定</button>
        </Modal>
    );
}
function HellLordDialog({ g, pr, ans }) {
    const [t1, setT1] = useState(pr.targets[0]);
    const [t2, setT2] = useState(pr.targets[1]);
    const [n1, setN1] = useState(null);
    const [n2, setN2] = useState(null);
    const ok = t1 !== t2 && n1 !== null && n2 !== null;
    return (
        <Modal title="地獄領主的猜測">
            <div className={UI.CH.m04}>選兩位不同玩家（有手牌且未免疫），各猜一次手牌點數 (1–13，格內是尚未出現的牌){pr.canWin ? '；兩次都猜中即獲勝。' : '。'}對方只有小丑時該次不觸發。</div>
            <div className={UI.CH.sectionTitle}>第一位</div>
            <PlayerBtns g={g} ids={pr.targets} onPick={setT1} />

// ── 最終比點動畫（牌庫抽完結算）：逐位玩家依序計分；面前牌逐張加總 → 外星人加成 → 翻開手牌加入 → 該玩家總分；最後最高分者放大 ──
function SettlementAnim({ g, speed, onDone }) {
    const S = g.settlement;
    const ev = [];
    const order = S.rows.map((r, pi) => pi).sort((a, b) => (S.rows[a].total - S.rows[b].total) || (a - b)); // 由點數最小的先開
    order.forEach(pi => {
        const r = S.rows[pi];
        ev.push({ t: 'start', pi, d: 450 });
        r.fronts.forEach((c, k) => ev.push({ t: 'front', pi, k, d: 480 }));
        if (r.alien) ev.push({ t: 'alien', pi, d: 750 });
        r.hand.forEach((c, h) => ev.push({ t: 'hand', pi, h, d: 1050 }));
        ev.push({ t: 'done', pi, d: 850 });
    });
    ev.push({ t: 'win', d: 2400 });
    const [step, setStep] = useState(0);
    useEffect(() => {
        if (step >= ev.length - 1) return; // 最後一步（宣布最高分者）後停住，等玩家點擊才結束
        const tm = setTimeout(() => setStep(step + 1), ev[step].d / speed);
        return () => clearTimeout(tm);
    }, [step, speed]);
    const applied = ev.slice(0, Math.min(step + 1, ev.length));
    const winShown = applied.some(e => e.t === 'win');
    const [canClose, setCanClose] = useState(false);
    useEffect(() => { if (!winShown) return; const tm = setTimeout(() => setCanClose(true), 700); return () => clearTimeout(tm); }, [winShown]); // 動畫放大後稍等，避免誤觸直接關閉
    const cur = (() => { let c = -1; applied.forEach(e => { if (e.t === 'start') c = e.pi; if (e.t === 'done' && e.pi === c) c = -1; }); return c; })();
    return (
        <Modal title="🏁 最終比點">
          <div onClick={() => { if (canClose) onDone(); }} className={canClose ? 'cursor-pointer' : ''}>
            <div className={UI.CH.m04}>牌庫抽完！面前區＋手牌（外星人手持者面前每張 +2）總點數最高者獲勝。</div>
            {S.rows.map((r, pi) => {
                const nf = applied.filter(e => e.t === 'front' && e.pi === pi).length;
                const alienOn = applied.some(e => e.t === 'alien' && e.pi === pi);
                const nh = applied.filter(e => e.t === 'hand' && e.pi === pi).length;
                const started = applied.some(e => e.t === 'start' && e.pi === pi);
                const tot = r.fronts.slice(0, nf).reduce((a, c) => a + c.v, 0) + (alienOn ? r.alien : 0) + r.hand.slice(0, nh).reduce((a, c) => a + c.v, 0);
                const isWin = winShown && S.winnerIds.includes(r.id);
                const cls = winShown ? (isWin ? 'settle-win' : 'settle-lose') : (pi === cur ? 'border-amber-400/70' : 'border-slate-600/70') + (started ? '' : ' opacity-60');
                return (
                    <div key={r.id} className={'rounded-lg border bg-slate-900/70 px-2 py-1.5 mb-1.5 transition-all duration-500 ' + cls}>
                        <div className="flex items-center gap-2">
                            <img src={window.AVATAR_URL(r.id)} className="w-7 h-7 rounded-full object-cover" alt="" onError={e => { e.target.style.visibility = 'hidden'; }} />
                            <span className="text-[12px] font-black text-sky-300">{r.name}{isWin ? ' 🏆' : ''}</span>
                            <span className="ml-auto flex items-baseline gap-0.5"><span key={tot} className="settle-pop gothic-num text-xl font-black text-amber-300">{tot}</span><span className="text-[10px] text-slate-400">點</span></span>
                        </div>
                        <div className="mt-1 flex flex-wrap items-center gap-1 min-h-[24px]">
                            {r.fronts.slice(0, nf).map((c, k) => <span key={k} className="settle-pop"><Chip c={c} /></span>)}
                            {alienOn && <span className="settle-pop text-[10px] font-black text-lime-300 border border-lime-500/60 rounded px-1">👽 外星人 +{r.alien}</span>}
                        </div>
                        <div className="mt-1 flex items-center gap-1.5">
                            <span className="text-[10px] text-slate-400">手牌</span>
                            {r.hand.length === 0 && <span className="text-[10px] text-slate-500">無</span>}
                            {r.hand.map((c, h) => h < nh
                                ? <div key={'f' + h} className="settle-flip front-card-bg bg-slate-900 shadow flex flex-col items-center justify-center rounded" style={{ width: 44, height: 58 }}>
                                    <span className="flex items-center gap-[2px] leading-none"><SuitIcon c={c} className={'w-[10px] h-[10px] ' + suitCls(c)} /><span className={UI.E.e55}>{c.v}</span></span>
                                    <span className="mt-0.5 text-[8px] font-black text-amber-100 leading-none">{c.n}</span>
                                  </div>
                                : <div key={'b' + h} className="card-back rounded shadow" style={{ width: 44, height: 58 }}></div>)}
                        </div>
                    </div>
                );
            })}
            {canClose && <div className="mt-2 text-center text-[12px] font-black text-amber-300 animate-pulse">👆 點擊任意處繼續</div>}
          </div>
        </Modal>
    );
}
function GameOverModal({ g, onNew, onNext, onClose }) {
    const win = g.winners.map(i => g.players[i].name);
    const m = g.match, champs = m.champions.map(i => g.players[i].name);
    return (
        <Modal title={m.finished ? `🏆 ${champs.join('、')} 贏得整場比賽！` : win.length ? `🏆 第 ${m.round} 局勝者：${win.join('、')}` : `🏆 第 ${m.round} 局：無人勝利`}>
            <div className={UI.CH.m04}>{[...g.log].reverse().find(l => l.type === 'win' && !l.msg.startsWith('🏆 比賽結束'))?.msg}</div>
            <div className={UI.CH.m04 + ' !text-sky-300 font-black'}><MatchBar g={g} />（先取得 {m.target} 勝者贏得比賽）</div>
            {g.players.map(p => (
                <div key={p.id} className="mb-1.5 border-b border-slate-700/60 pb-1">
                    <div className="text-[11px] font-black text-sky-300">{p.name}{g.winners.includes(p.id) ? ' 🏆' : ''}　面前 {frontSum(p)} 點{p.bindTo != null && <span className="text-fuchsia-300">　💖 魅魔綁定：{g.players[p.bindTo].name}</span>}</div>
                    <div className={UI.CH.m05 + ' !my-0.5 !justify-start'}>
                        {p.front.map((c, i) => <Chip key={'f' + i} c={c} />)}
                        {p.hand.length > 0 && <span className="text-[10px] text-slate-500 mx-1">手牌：</span>}
                        {p.hand.map((c, i) => <Chip key={'h' + i} c={c} />)}
                    </div>
                </div>
            ))}
            <div className={UI.CH.m05}>
                {!m.finished && <button className={UI.CH.btn} onClick={onNext}>開始第 {m.round + 1} 小局</button>}
                <button className={m.finished ? UI.CH.btn : UI.CH.btnGhost} onClick={onNew}>{m.finished ? '開始新比賽' : '重新比賽'}</button>
                <button className={UI.CH.btnGhost} onClick={onClose}>看牌桌</button>
            </div>
        </Modal>
    );
}

function Table({ g, dispatch, onNew, onNext, speed, setSpeed, toast, initialUi, awaiting, onContinue, canUndo, onUndo }) {
    const [ui, setUi] = useState({ modal: null, sel: null, showBroadcast: true, overDismissed: false, ...(initialUi || {}) });
    const patch = o => setUi(u => ({ ...u, ...o }));
    const me = g.players[HUMAN];
    const noPrompt = !g.prompt && !g.gameOver;
    const myTurn = g.currentTurn === HUMAN && noPrompt;
    const hasPK = me.hand.some(c => c.id === 'PUMPKIN_KING');
    const canDraw = myTurn && g.phase === 'DRAW' && me.hand.length < 2 && (g.deck.length > 0 || (g.reserveDrawOk && g.reserves.length > 0));
    const canTake = myTurn && g.phase === 'DRAW' && me.hand.length === 1 && !hasPK && g.centerCards.some(Boolean);
    const canPlay = myTurn && (g.phase === 'PLAY' || (g.phase === 'DRAW' && me.hand.length >= 2));
    const returning = myTurn && g.phase === 'RETURN';
    const selCard = ui.sel !== null ? me.hand[ui.sel] : null;
    const hints = E.handHints(g, me);
    const myContrib = new Set(hints.contrib);
    const showGuide = name => patch({ modal: { type: 'guide', name } });
    const act = a => { patch({ sel: null }); return dispatch(a); };

    const pkComps = hasPK ? me.hand.map((c, i) => ({ c, i })).filter(x => x.c.id === 'SKELETON' || x.c.id === 'HEADLESS') : [];
    const pkIdx = me.hand.findIndex(c => c.id === 'PUMPKIN_KING');
    const onPlay = () => { // 手上有南瓜王＋骷髏／無頭騎士：不必選兩張，直接按「出牌」就能選「同時打出」
        if (pkComps.length && (!selCard || selCard.id === 'PUMPKIN_KING' || selCard.id === 'SKELETON' || selCard.id === 'HEADLESS')) {
            patch({ modal: { type: 'pk', comps: pkComps, pkIdx, solo: ui.sel !== null ? ui.sel : pkIdx } }); return;
        }
        if (!selCard) return;
        act({ type: 'play', handIndex: ui.sel });
    };
    const mainBtn = returning
        ? { label: '放回暗牌', on: !!selCard && selCard.id !== 'PUMPKIN_KING', run: () => act({ type: 'return', handIndex: ui.sel }) }
        : canPlay ? { label: pkComps.length ? '出牌/組合' : '出牌', on: !!selCard || pkComps.length > 0, run: onPlay }
        : { label: '抽牌', on: canDraw, run: () => act({ type: 'draw' }) };

    const hint = g.gameOver ? '遊戲結束'
        : g.prompt ? (g.prompt.playerId === HUMAN ? '請在彈窗中做出選擇' : `等待 ${g.players[g.prompt.playerId].name} 回應…`)
        : g.currentTurn !== HUMAN ? `${g.players[g.currentTurn].name} 思考中…`
        : returning ? '選一張手牌，放回剛拿的暗牌位置'
        : canPlay ? (pkComps.length ? '你有南瓜王＋' + pkComps[0].c.n + '：按「出牌」可同時打出' : hasPK ? '你有南瓜王：必須出南瓜王／骷髏／無頭騎士' : '選一張手牌打出')
        : '抽一張牌，或拿一張暗牌換';

    // ── 動畫：抽牌（牌背從牌庫飛向抽牌者／新手牌從牌庫飛入）與打出（新牌從出牌者飛到面前區）──
    const seenRef = useRef(null);
    useLayoutEffect(() => {
        const stage = document.getElementById('chaos-stage');
        if (!stage) return;
        const sr = stage.getBoundingClientRect(), sc = (sr.width / STAGE_W) || 1;
        const cur = { front: new Set(), hand: new Set(), deck: g.deck.length };
        g.players.forEach(pl => { pl.front.forEach(c => cur.front.add(c.uid)); if (pl.id === HUMAN) pl.hand.forEach(c => cur.hand.add(c.uid)); });
        const prev = seenRef.current; seenRef.current = cur;
        if (!prev || g.gameOver) return;
        const ctr = el => { if (!el) return null; const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
        const ease = 'cubic-bezier(.2,.8,.25,1)';
        const flyIn = (el, from, d, s0) => { // 讓牌自己從 from 飛到原本的位置
            const t = ctr(el); if (!t || !from) return;
            el.animate([
                { transform: `translate(${(from.x - t.x) / sc}px, ${(from.y - t.y) / sc}px) scale(${s0 || .5})`, opacity: 0.2, offset: 0 },
                { opacity: 1, offset: .3 },
                { transform: 'translate(0,0) scale(1)', opacity: 1 }], { duration: d || 520, easing: ease });
        };
        const q = sel => stage.querySelector(sel);
        const deckC = ctr(document.getElementById('deck-el'));
        // 打出／搶牌／復活：新出現在面前區的牌
        g.players.forEach(pl => pl.front.forEach(c => {
            if (prev.front.has(c.uid)) return;
            const from = pl.id === HUMAN ? ctr(document.getElementById('hand-el')) : ctr(q(`[data-opp="${pl.id}"]`));
            flyIn(q(`[data-uid="${c.uid}"]`), from, 560, .45);
        }));
        // 我抽到／拿到的新手牌：從牌庫飛入
        g.players[HUMAN].hand.forEach(c => { if (!prev.hand.has(c.uid)) flyIn(q(`[data-uid="${c.uid}"]`), deckC, 520, .35); });
        // 對手抽牌：牌背從牌庫飛向他的頭像
        if (g.currentTurn !== HUMAN && prev.deck > cur.deck && deckC) {
            const to = ctr(q(`[data-opp="${g.currentTurn}"]`));
            if (to) for (let k = 0; k < Math.min(2, prev.deck - cur.deck); k++) {
                const b = document.createElement('div');
                b.className = 'card-back';
                Object.assign(b.style, { position: 'absolute', left: ((deckC.x - sr.left) / sc - 18) + 'px', top: ((deckC.y - sr.top) / sc - 24) + 'px', width: '36px', height: '48px', borderRadius: '3px', zIndex: 200, pointerEvents: 'none', boxShadow: '0 2px 8px rgba(0,0,0,.6)' });
                stage.appendChild(b);
                const a = b.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${(to.x - deckC.x) / sc}px, ${(to.y - deckC.y) / sc}px) scale(.7)`, opacity: .9 }], { duration: 520, delay: k * 140, easing: ease, fill: 'both' });
                a.onfinish = () => b.remove();
            }
        }
    });
    const last = g.log.filter(l => l.type !== 'discard');
    const l1 = last[last.length - 1], l2 = last[last.length - 2];
    const opponents = g.players.filter(p => p.id !== HUMAN);
    const n = me.front.length, step = n <= 1 ? 0 : Math.min(54, Math.floor((STAGE_W - 24 - 72) / (n - 1)));
    const m = ui.modal;

    return (
        <PeekCtx.Provider value={c => patch({ peek: c })}>
            <header className={UI.A.a01}>
                <div className={UI.A.a02}><span className={UI.A.a03}>{VERSION}</span></div>
                <div className={UI.A.a04}>
                    <button onClick={onNew} className={UI.A.a05}><i className={UI.A.a06}></i><span>新局</span></button>
                    <button onClick={() => patch({ showBroadcast: !ui.showBroadcast })} className={UI.A.a07({ showBroadcast: ui.showBroadcast })}>動態</button>
                    <button onClick={() => setSpeed(speed === 1 ? 2 : speed === 2 ? 0.5 : 1)} className={UI.A.a08({ speed, v: speed })}>{speed}x</button>
                    <button onClick={() => patch({ modal: { type: 'rules' } })} className={UI.A.a09}><i className={UI.A.a10}></i><span className={UI.A.a11}>規則</span></button>
                    <button onClick={() => patch({ modal: { type: 'log' } })} className={UI.A.a12}><i className={UI.A.a13}></i><span className={UI.A.a14}>紀錄</span></button>
                </div>
            </header>

            {ui.showBroadcast && (
                <div className={UI.B.b01}>
                    <div className={UI.B.b02({ broadcastEvent: null })}>
                        <div className={UI.B.b03}>
                            <div className={UI.B.b04}><span className={UI.B.b05}></span><span className={UI.B.b06}>{l1 ? l1.msg : '遊戲開始'}</span></div>
                        </div>
                    </div>
                </div>
            )}

            <div className={UI.C.c01}>
                <div className="relative">
                    {(() => {
                        const ITEMS = [['南瓜', 'PUMPKIN'], ['月亮', 'MOON'], ['鮮血', 'BLOOD']];
                        const got = ITEMS.filter(([, id]) => g.discard.some(c => c.id === id)).length;
                        return (<>
                            <button className={UI.C.c20} onClick={() => patch({ itemOpen: !ui.itemOpen })}>
                                <span className={got ? UI.C.c22 : UI.C.c21}>道具牌({got}/3)</span>
                                <i className={'fa-solid text-slate-400 ' + (ui.itemOpen ? 'fa-chevron-up' : 'fa-chevron-down')}></i>
                            </button>
                            {ui.itemOpen && (
                                <div className={UI.C.c24}>
                                    {ITEMS.map(([nm, id]) => {
                                        const on = g.discard.some(c => c.id === id);
                                        return (
                                            <button key={id} type="button" className="w-full flex items-center justify-between gap-3 text-left active:scale-[0.98]"
                                                onClick={e => { e.stopPropagation(); patch({ modal: { type: 'guide', name: nm } }); }}>
                                                <span className={(on ? UI.C.c22 : UI.C.c21) + ' underline decoration-dotted'}>{nm}</span>
                                                <span className={on ? UI.C.c22 : UI.C.c21}>{on ? '已出現 1/1' : '未出現 0/1'}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            )}
                        </>);
                    })()}
                </div>
                <div className={UI.C.c06}>
                    <button className={UI.C.c02} onClick={() => patch({ modal: { type: 'discard' } })}>
                        <i className="fa-solid fa-trash-can text-amber-400"></i><span className={UI.C.c04}>棄牌</span><span className={UI.C.c05}>{g.discard.length}</span>
                    </button>
                    <button className={UI.C.c11} onClick={() => patch({ modal: { type: 'center', pick: false } })}>
                        <i className={UI.C.c12}></i><span className={UI.C.c13}>暗牌 <span className={UI.C.c14}>{g.centerCards.filter(Boolean).length}</span></span>
                        <span className="text-slate-500">/</span>
                        <i className={UI.C.c08}></i><span className={UI.C.c09}>備用 <span className={UI.C.c10}>{g.reserves.filter(Boolean).length}</span></span>
                    </button>
                    <div id="deck-el" className={UI.C.c15 + (g.deck.length <= 5 && !g.gameOver ? ' ' + UI.C.c23 : '')} onClick={() => patch({ modal: { type: 'deck' } })}><i className={UI.C.c16}></i><span className={UI.C.c17}>牌庫 <span className={UI.C.c18}>{g.deck.length}</span></span></div>
                </div>
            </div>

            <section className={UI.D.d01}>
                {opponents.map(p => {
                    const isTurn = g.currentTurn === p.id && !g.gameOver;
                    return (
                        <div key={p.id} data-opp={p.id} className={UI.D.d02({ isDead: false, isTurn })}>
                            <div className={UI.D.d03}>
                                {me.bindTo === p.id && <span className="text-fuchsia-300">💖</span>}
                                {p.immune && <span className={UI.D.d08}><i className={UI.D.d09}></i>免疫</span>}
                                <span className="text-amber-300">🏆{g.match.wins[p.id] || 0}</span>
                            </div>
                            <div className={UI.D.d14({ player: { gradient: GRADS[p.id % 6] } })}>
                                <img src={window.AVATAR_URL(p.id)} className={UI.D.d15} alt="" onError={e => { e.target.style.visibility = 'hidden'; }} />
                            </div>
                            <span className={UI.D.d16({ isTurn })}>{p.name}</span>
                            <span className="text-[9px] leading-none text-amber-200/90 font-bold">{frontSum(p)} 點</span>
                        </div>
                    );
                })}
            </section>

            <main className={UI.E.e01}>
                <div className={UI.E.e02}></div>
                <div className={UI.E.e05}>
                    {opponents.map(p => {
                        const tv = E.tenpaiView(g, p), cs = new Set(tv.contrib);
                        return (
                        <div key={p.id} className={UI.E.e06}>
                            <OppFront cards={p.front} cs={cs} />
                            {!g.match.darkMode && p.hand.length > 0 && (
                                <div className="flex flex-col items-center gap-[2px] mt-0.5 w-full">
                                    <span className="text-[9px] text-sky-300">手牌（明牌）</span>
                                    {p.hand.map((c, i) => <Chip key={'h' + (c.uid || i)} c={c} />)}
                                </div>
                            )}
                            {tv.tenpai.length > 0 && (
                                <div className="flex flex-col items-center mt-0.5 max-w-full">
                                    <div className={UI.CH.tenpaiText + ' flex flex-col items-center'}>
                                        <span>等待：</span>
                                        <TenpaiNames names={tv.tenpai} onPick={showGuide} />
                                    </div>
                                </div>
                            )}
                        </div>
                        );
                    })}
                </div>
                <div className={UI.E.e15}>
                    <div>
                        {g.deck.length > 0 && g.deck.length <= 9 && !g.gameOver && <div className="text-center text-[12px] font-black text-rose-300 tracking-wide mb-0.5 animate-pulse">⚠ 最後 {g.deck.length} 張牌</div>}
                        {awaiting
                            ? <div className="flex flex-col items-center">
                                <button className={UI.CH.btn + ' !text-[14px] !px-5 !py-2'} onClick={onContinue}>▶ 輪到【{awaiting}】（點擊繼續）</button>
                                <div className={UI.CH.hintSub}>先看看上一位的動作，準備好再點擊</div>
                              </div>
                            : <>
                               <div className={UI.CH.hint}>{hint}</div>
                               <div className={UI.CH.hintSub}>{myTurn && g.extraTurn ? '（額外回合）' : ''}</div></>}
                        {toast && <div className={UI.CH.toast}>{toast}</div>}
                    </div>
                </div>
                <div className={UI.E.e51}></div>
                {/* E 區左下：點數與獎杯，對齊頭像上方 */}
                <div className="absolute left-1.5 bottom-1 z-20 flex flex-col items-start gap-0.5 pointer-events-none">
                    <div className="text-[10px] leading-none text-amber-200 font-black tabular-nums">{frontSum(me)} 點</div>
                    <div className="text-[10px] leading-none text-amber-300 font-black tabular-nums">🏆 {g.match.wins[HUMAN] || 0}/{g.match.target}</div>
                </div>
                <div className={UI.E.e52}>
                    <div className={UI.E.e53} style={{ width: 72 + (n > 0 ? (n - 1) * step : 0), height: n ? 96 : 0 }}>
                        {me.front.map((c, i) => (
                            <button key={c.uid || i} data-uid={c.uid} className={UI.E.e54({ active: myContrib.has(c.uid) })} style={{ left: i * step, width: 72, height: 96, zIndex: i }}
                                onClick={() => patch({ modal: { type: 'card', c } })}>
                                <span className={UI.E.e55}>{c.v}</span>
                                <span className={'text-2xl ' + suitCls(c)}>{sym(c) || '✦'}</span>
                                <span className={UI.E.e57}>{c.n}</span>
                            </button>
                        ))}
                    </div>
                </div>
            </main>

            <footer id="hand-el" className={UI.F.f01}>
                {g.gameOver && ui.overDismissed && (
                    <div className={UI.F.f02}><button onClick={g.match.finished ? onNew : onNext} className={UI.F.f03}><i className={UI.F.f04}></i><span>{g.match.finished ? '開始新比賽' : `開始第 ${g.match.round + 1} 小局`}</span></button></div>
                )}
                <div className="absolute left-1.5 top-1.5 z-20">
                    <div className={UI.F.f05({ isDead: false, isTurn: g.currentTurn === HUMAN && !g.gameOver })}>
                        <div className={UI.F.f06({ me: { gradient: GRADS[0] } })}>
                            <img src={window.AVATAR_URL(0)} className={UI.F.f07} alt="" onError={e => { e.target.style.visibility = 'hidden'; }} />
                        </div>
                        <span className={UI.F.f09({ isTurn: g.currentTurn === HUMAN })}>{me.name}</span>
                    </div>
                    {me.bindTo != null && <div className="text-[9px] text-fuchsia-300 text-center">💖 綁定 {g.players[me.bindTo].name}</div>}
                    {me.immune && <div className="text-[9px] text-cyan-300 text-center"><i className="fa-solid fa-shield-halved"></i> 免疫</div>}
                    {hints.tenpai.length > 0 && (
                        <div className="mt-1 w-[78px] flex flex-col items-start">
                            <div className={UI.CH.tenpaiText + ' w-full !text-left flex flex-col items-start'}>
                                <span>等待：</span>
                                <TenpaiNames names={hints.tenpai} onPick={showGuide} />
                            </div>
                        </div>
                    )}
                </div>
                <div className={UI.F.f37}>
                    <div className={UI.F.f38}>
                        {me.hand.length === 0 && <div className={UI.F.f47}>無手牌</div>}
                        {me.hand.map((c, i) => {
                            const isSelected = ui.sel === i;
                            const hh = hints.cards[i] || {};
                            const hintCls = hh.canWin ? ' hand-win' : hh.enables ? ' hand-tenpai' : '';
                            return (
                                <div key={c.uid} data-uid={c.uid} className={UI.F.f39({ card: c, dragGhost: null, drawAnim: null, isSelected }) + hintCls}
                                    onClick={() => (canPlay || returning) && patch({ sel: isSelected ? null : i })}>
                                    <button className={UI.CH.infoDot} onClick={e => { e.stopPropagation(); patch({ modal: { type: 'card', c, after: hh.after } }); }}>i</button>
                                    {hh.canWin && <span className={UI.CH.tagWin}>可勝利</span>}
                                    {!hh.canWin && hh.enables && <span className={UI.CH.tagTenpai}>額外叫糊</span>}
                                    <div className={UI.F.f40}><SuitIcon c={c} className={'cd-s ' + suitCls(c) + (String(c.v).length > 1 ? ' two' : '')} /><span className={UI.F.f41({ isSelected }) + (String(c.v).length > 1 ? ' two' : '')}>{c.v}</span></div>
                                    <div className={UI.F.f45}>{c.n}</div>
                                    <div className={UI.F.f44}><div className={UI.F.f46}>{(GUIDE[c.id] || {}).effect || (GUIDE[c.id] || {}).victory || ''}</div></div>
                                </div>
                            );
                        })}
                    </div>
                </div>
                <div className={UI.F.f62}>
                    <button className={UI.CH.act({ enabled: mainBtn.on })} disabled={!mainBtn.on} onClick={mainBtn.run}>{mainBtn.label}</button>
                    <button className={UI.CH.act({ enabled: canTake })} disabled={!canTake} onClick={() => patch({ modal: { type: 'center', pick: true } })}>拿暗牌</button>
                </div>
            </footer>

            {m && m.type === 'rules' && <RulesModal onClose={() => patch({ modal: null })} />}
            {m && m.type === 'log' && <LogModal g={g} onClose={() => patch({ modal: null })} />}
            {m && m.type === 'deck' && <DeckModal g={g} onClose={() => patch({ modal: null })} />}
            {m && m.type === 'discard' && <DiscardModal g={g} onClose={() => patch({ modal: null })} />}
            {m && m.type === 'card' && <CardDetail c={m.c} after={m.after} onClose={() => patch({ modal: null })} />}
            {m && m.type === 'guide' && <GuideModal name={m.name} onClose={() => patch({ modal: null })} />}
            {m && m.type === 'center' && <CenterModal g={g} pick={m.pick} onClose={() => patch({ modal: null })} onTake={i => { patch({ modal: null }); act({ type: 'take', slot: i }); }} />}
            {m && m.type === 'pk' && (
                <Modal title="南瓜王" onClose={() => patch({ modal: null })}>
                    <div className={UI.CH.m04}>{g.discard.some(c => c.id === 'PUMPKIN') ? '✅ 南瓜已出現：同時打出南瓜王與骷髏／無頭騎士即可獲勝！' : '同時打出南瓜王與骷髏／無頭騎士（南瓜出現後同時打出即獲勝；目前尚未出現南瓜，不會獲勝）。'}</div>
                    <div className={UI.CH.m05}>
                        {m.comps.map(x => <button key={x.i} className={UI.CH.btn} onClick={() => { patch({ modal: null }); act({ type: 'play', handIndex: m.pkIdx, companionIndex: x.i }); }}>南瓜王＋{x.c.n}　同時打出</button>)}
                        <button className={UI.CH.btnGhost} onClick={() => { patch({ modal: null }); act({ type: 'play', handIndex: m.solo }); }}>只打出【{(me.hand[m.solo] || {}).n}】</button>
                    </div>
                </Modal>
            )}
            {g.prompt && g.prompt.playerId === HUMAN && !g.gameOver && (
                <BackCtx.Provider value={canUndo && !['minotaurSwap', 'seaMonster', 'ghostMove', 'ghostSettle', 'frankenstein'].includes(g.prompt.type) ? () => { patch({ sel: null, modal: null }); onUndo(); } : null}>
                    <PromptDialog g={g} pr={g.prompt} dispatch={dispatch} />
                </BackCtx.Provider>)}
            {g.gameOver && g.settlement && !ui.settleDone && <SettlementAnim g={g} speed={speed} onDone={() => patch({ settleDone: true })} />}
            {g.gameOver && (!g.settlement || ui.settleDone) && !ui.overDismissed && <GameOverModal g={g} onNew={onNew} onNext={onNext} onClose={() => patch({ overDismissed: true })} />}
            {ui.peek && <CardDetail c={ui.peek} onClose={() => patch({ peek: null })} />}
        </PeekCtx.Provider>
    );
}

// AI 回合開始時必須先被玩家點擊放行（以 turnNo 記錄）；AI 回合中途的抽牌／出牌／彈窗不再需要點擊
const needsAck = (s, ack) => !s.gameOver && !s.prompt && s.players[s.currentTurn].isAI && ack !== s.turnNo;
function StartScreen({ onStart }) {
    const [dark, setDark] = useState(true);
    return (
        <div className="absolute inset-0 z-[140] flex flex-col items-center justify-center bg-slate-950/85">
            <div className={UI.CH.startTitle}>群魔</div>
            <div className={UI.CH.startSub}>單機版：你 vs AI　先取得 2 小局勝利者贏得比賽</div>
            <div className="flex gap-2 mt-5">
                <button className={dark ? UI.CH.btn : UI.CH.btnGhost} onClick={() => setDark(true)}>暗牌模式</button>
                <button className={!dark ? UI.CH.btn : UI.CH.btnGhost} onClick={() => setDark(false)}>全明牌模式</button>
            </div>
            <div className={UI.CH.startSub}>{dark ? '看不到對手手牌' : '對手手牌全部公開（測試用）'}；選擇人數開始</div>
            <div className="flex gap-2 mt-4">
                {[3, 4, 5, 6].map(n => <button key={n} className={UI.CH.btn} onClick={() => onStart(n, dark)}>{n} 人</button>)}
            </div>
        </div>
    );
}

function App() {
    const gameRef = useRef(null);
    const ackRef = useRef(-1); // 已點擊放行的回合序號：AI 回合必須先被放行才會行動
    const undoRef = useRef([]); // 真人行動前的狀態快照：選擇彈窗的「返回上一步」
    const [tick, setTick] = useState(0);
    const [speed, setSpeed] = useState(1);
    const [toast, setToast] = useState('');
    const [gid, setGid] = useState(0);
    const [scale, setScale] = useState(1);
    const bump = () => setTick(t => t + 1);
    useEffect(() => {
        const f = () => setScale(Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H));
        f(); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f);
    }, []);
    const start = (n, dark) => {
        setGid(x => x + 1);
        ackRef.current = -1; undoRef.current = [];
        gameRef.current = E.newGame(Array.from({ length: n }, (_, i) => ({ name: NAMES[i], isAI: i !== HUMAN })), { darkMode: dark });
        setToast(''); bump();
    };
    const nextRound = () => { // 下一小局：沿用玩家、勝場與模式
        const nx = E.nextRound(gameRef.current);
        if (!nx) return;
        setGid(x => x + 1);
        ackRef.current = -1; undoRef.current = [];
        gameRef.current = nx;
        setToast(''); bump();
    };
    const dispatch = a => {
        const snap = structuredClone(gameRef.current);
        const r = E.act(gameRef.current, HUMAN, a);
        if (!r.ok) { setToast(r.error); setTimeout(() => setToast(''), 2200); }
        else {
            setToast('');
            const s2 = gameRef.current;
            if (s2.prompt && s2.prompt.playerId === HUMAN && !s2.gameOver) undoRef.current.push(snap); else undoRef.current = [];
        }
        bump(); return r;
    };
    const undo = () => { const snap = undoRef.current.pop(); if (!snap) return; gameRef.current = snap; setToast(''); bump(); };
    useEffect(() => { // AI 與電腦座位的自動行動
        const s = gameRef.current;
        if (!s || s.gameOver) return;
        const owner = s.prompt ? s.players[s.prompt.playerId] : s.players[s.currentTurn];
        if (!owner.isAI) return;
        if (needsAck(s, ackRef.current)) return; // 等待玩家點擊「繼續」
        const t = setTimeout(() => { const r = E.aiStep(s); if (!r.ok) { console.error('AI 錯誤：', r.error); return; } bump(); }, 750 / speed);
        return () => clearTimeout(t);
    }, [tick, speed]);
    const g = gameRef.current;
    const awaiting = g && needsAck(g, ackRef.current) ? g.players[g.currentTurn].name : null;
    const onContinue = () => { ackRef.current = gameRef.current.turnNo; bump(); };
    return (
        <div className={UI.root.r01}>
            <div id="chaos-stage" className={UI.root.r02} style={{ width: STAGE_W, height: STAGE_H, transform: `scale(${scale})`, transformOrigin: 'center center' }}>
                <video className="table-bg-video" src="video/bg.mp4" autoPlay loop muted playsInline preload="auto"></video>
                {g ? <Table key={gid} g={g} dispatch={dispatch} onNew={() => { gameRef.current = null; bump(); }} onNext={nextRound} speed={speed} setSpeed={setSpeed} toast={toast} awaiting={awaiting} onContinue={onContinue} canUndo={undoRef.current.length > 0} onUndo={undo} />
                    : <StartScreen onStart={start} />}
            </div>
        </div>
    );
}
// ── 進場前預載：video/bg.mp4 與 photo/ 內所有圖片都載入完才進場 ──
const PRELOAD_IMAGES = ['card', 'cardb', 'cards', '狼card', '吸card', '女card', '科card'].map(n => `photo/${n}.jpg`)
    .concat([0, 1, 2, 3, 4, 5].map(i => window.AVATAR_URL(i)));
const PRELOAD_VIDEO = 'video/bg.mp4';
function Boot() {
    const [done, setDone] = useState(0);
    const [ready, setReady] = useState(false);
    const total = PRELOAD_IMAGES.length + 1;
    useEffect(() => {
        let alive = true, count = 0;
        const hit = () => { count++; if (alive) { setDone(count); if (count >= total) setReady(true); } };
        PRELOAD_IMAGES.forEach(u => { const im = new Image(); im.onload = im.onerror = hit; im.src = u; });
        const v = document.createElement('video');
        let vd = false; const vhit = () => { if (!vd) { vd = true; hit(); } };
        v.preload = 'auto'; v.muted = true;
        v.addEventListener('canplaythrough', vhit); v.addEventListener('error', vhit);
        v.src = PRELOAD_VIDEO; v.load();
        const to = setTimeout(() => { if (alive) setReady(true); }, 30000); // 保險：最久等 30 秒
        return () => { alive = false; clearTimeout(to); };
    }, []);
    if (!ready) return (
        <div className="fixed inset-0 flex flex-col items-center justify-center bg-slate-950 text-amber-300">
            <div className={UI.CH.startTitle}>群魔</div>
            <div className="mt-4 w-56 h-1.5 rounded-full bg-slate-800 overflow-hidden"><div className="h-full bg-amber-400 transition-all" style={{ width: `${Math.round(done / total * 100)}%` }}></div></div>
            <div className="mt-2 text-xs text-slate-400">載入中… {Math.round(done / total * 100)}%</div>
        </div>
    );
    return <App />;
}
window.__Chaos = { App, Table, needsAck };
if (document.getElementById('root')) ReactDOM.createRoot(document.getElementById('root')).render(<Boot />);

    </script>
</body>
