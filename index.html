function confirmCompareTarget(targetId, cardId) {
    const p = state.players[state.currentTurn];
    const target = state.players.find(x => x.id === targetId);
    const card = { id: cardId };
    
    log(`🎯 ${p.name} 選擇了【${target.name}】進行比大小。`, 'target');
    closeModal();
    executeCompare(p, target, card);
    updateUI();
    endTurn();
}

function executeCompare(p, target, card) {
    const myCard = targetableHandCards(p)[0];
    const opponentCard = targetableHandCards(target)[0];
    if (!myCard || !opponentCard) {
        log(`➔ 手牌中的小丑不受比牌效果影響。`, 'sys');
        return;
    }
    const myVal = myCard.v || 0;
    const oppVal = opponentCard.v || 0;
    const isTroll = card.id === 'TROLL';
    
    log(`➔ ${p.name} (手牌 ${myVal}) 與 ${target.name} (手牌 ${oppVal}) 比手牌${isTroll ? '大' : '小'}。`, 'target');
    
    if (isTroll) {
        if (myVal < oppVal) {
            const lost = p.hand.splice(p.hand.indexOf(myCard), 1)[0];
            target.front.push(lost);
            log(`➔ ${p.name} 較小，將手牌 ${lost.n} 放在 ${target.name} 面前。`, 'target');
            const drawn = forceDraw(p, false);
            if (drawn) p.hand.push(drawn);
            log(`➔ ${p.name} 失去手牌，補抽 1 張牌。`, 'sys');
        } else if (oppVal < myVal) {
            const lost = target.hand.splice(target.hand.indexOf(opponentCard), 1)[0];
            p.front.push(lost);
            log(`➔ ${target.name} 較小，將手牌 ${lost.n} 放在 ${p.name} 面前。`, 'target');
            const drawn = forceDraw(target, false);
            if (drawn) target.hand.push(drawn);
            log(`➔ ${target.name} 失去手牌，補抽 1 張牌。`, 'sys');
        } else { log(`➔ 平手，無事發生。`, 'target'); }
    } else {
        if (myVal > oppVal) {
            const lost = p.hand.splice(p.hand.indexOf(myCard), 1)[0];
            target.front.push(lost);
            log(`➔ ${p.name} 較大，將手牌 ${lost.n} 放在 ${target.name} 面前。`, 'target');
            const drawn = forceDraw(p, false);
            if (drawn) p.hand.push(drawn);
            log(`➔ ${p.name} 失去手牌，補抽 1 張牌。`, 'sys');
        } else if (oppVal > myVal) {
            const lost = target.hand.splice(target.hand.indexOf(opponentCard), 1)[0];
            p.front.push(lost);
            log(`➔ ${target.name} 較大，將手牌 ${lost.n} 放在 ${p.name} 面前。`, 'target');
            const drawn = forceDraw(target, false);
            if (drawn) target.hand.push(drawn);
            log(`➔ ${target.name} 失去手牌，補抽 1 張牌。`, 'sys');
        } else { log(`➔ 平手，無事發生。`, 'target'); }
    }
}

// --- 喪屍選擇彈窗 ---
function showZombieModal(p, sourceCard) {
    const validTargets = state.players.filter(x =>
        getZombieDiscardOptions(x, p.id, sourceCard.uid).length > 0 && !x.immune);
    if (validTargets.length === 0) {
        log(`🧟 你打出【喪屍】，但全場沒有玩家面前有牌（或皆免疫），效果不發動。`, 'sys');
        endTurn();
        return;
    }

    showModal('喪屍的啃咬', `
        <p>選擇一位玩家（可選自己），棄掉他面前的一張牌；若選自己，不可棄掉剛打出的牌。</p>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:15px; flex-wrap:wrap;">
            ${validTargets.map(t => `<button onclick="selectZombieTarget(${t.id}, '${sourceCard.uid}')" style="padding:10px 20px; background:#3b4754; color:white; border:none; border-radius:4px; cursor:pointer;">${t.name}</button>`).join('')}
        </div>
    `);
}

function selectZombieTarget(targetId, sourceCardUid) {
    const target = state.players.find(x => x.id === targetId);
    const actor = state.players[state.currentTurn];
    if (!target || !actor) return;
    const options = getZombieDiscardOptions(target, actor.id, sourceCardUid);

    if (options.length === 1) {
        confirmZombieCard(targetId, options[0].index, sourceCardUid);
    } else {
        let html = `<p>選擇要棄掉【${target.name}】面前的哪一張牌：</p><div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:15px;">`;
        options.forEach(({ card, index }) => {
            html += `<button onclick="confirmZombieCard(${targetId}, ${index}, '${sourceCardUid}')" style="padding:10px; background:#3b4754; color:white; border:none; border-radius:4px; cursor:pointer; display:flex; flex-direction:column; align-items:center;">
                <span style="font-size:18px; font-weight:bold; color:#fcd34d;">${card.v}</span>
                <span style="font-size:12px;">${card.n}</span>
            </button>`;
        });
        html += `</div>`;
        showModal('選擇棄牌', html);
    }
}

function confirmZombieCard(targetId, cardIndex, sourceCardUid) {
    const target = state.players.find(x => x.id === targetId);
    const actor = state.players[state.currentTurn];
    const canDiscard = target && actor && !target.immune &&
        getZombieDiscardOptions(target, actor.id, sourceCardUid).some(option => option.index === cardIndex);

    if (canDiscard) {
        const discarded = target.front.splice(cardIndex, 1)[0];
        putToDiscard(discarded, `${target.name} 因【喪屍】效果被迫棄掉面前的牌`);
    } else {
        log(`🧟 喪屍效果取消：所選牌已無法棄除。`, 'sys');
    }
    
    closeModal();
    updateUI();
    endTurn();
}

function getJokerEffectTargets(joker) {
    const matchesColor = joker.id === 'RED_JOKER' ? isRedCard : isBlueCard;
    return state.players.flatMap(player => player.front
        .map((card, index) => ({ player, card, index }))
        .filter(({ card }) => !isJokerCard(card) && matchesColor(card)));
}

function showJokerEffectModal(p, joker) {
    const targets = getJokerEffectTargets(joker);
    if (targets.length === 0) {
        log(`🃏 你打出【${joker.n}】，但面前區沒有可發動效果的同色牌。`, 'sys');
        endTurn();
        return;
    }

    const colorName = joker.id === 'RED_JOKER' ? '紅色' : '藍色';
    const orderedPlayers = [
        ...state.players.filter(player => player.id !== p.id),
        ...state.players.filter(player => player.id === p.id)
    ];
    const playerSections = orderedPlayers.map(player => {
        const playerTargets = targets.filter(target => target.player.id === player.id);
        if (playerTargets.length === 0) return '';
        return `<div style="background:#1e293b; padding:8px; border-radius:6px; margin-top:8px;">
            <div style="color:#93c5fd; margin-bottom:5px; font-size:12px; font-weight:bold;">${player.id === p.id ? '你' : player.name} 面前：</div>
            <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
                ${playerTargets.map(({ card, index }) => `
                    <button onclick="confirmJokerEffect(${player.id}, ${index}, '${joker.uid}')" style="padding:8px 12px; background:#3b4754; color:white; border:none; border-radius:4px; cursor:pointer;">
                        ${SUIT_SYMBOLS[card.suit] || ''}${card.n}
                    </button>`).join('')}
            </div>
        </div>`;
    }).join('');
    const html = `<p>可選擇其他玩家或你自己面前區的${colorName}牌，發動該牌效果（先列出其他玩家）：</p>${playerSections}`;
    showModal(`${joker.n}的效果`, html);
}

function confirmJokerEffect(targetId, cardIndex, jokerUid) {
    const p = state.players[state.currentTurn];
    const target = state.players.find(player => player.id === targetId);
    const copiedCard = target && target.front[cardIndex];
    const joker = p.front.find(card => card.uid === jokerUid);
    const matchesColor = joker && (joker.id === 'RED_JOKER' ? isRedCard : isBlueCard);
    const isAvailableTarget = target && copiedCard && joker &&
        getJokerEffectTargets(joker).some(option =>
            option.player.id === target.id && option.card.uid === copiedCard.uid);
    if (!isAvailableTarget || isJokerCard(copiedCard) || !matchesColor(copiedCard)) {
        closeModal();
        log(`🃏 所選牌不在任何玩家面前區，或不是可發動的同色牌；效果取消。`, 'sys');
        endTurn();
        return;
    }

    closeModal();
    const waitingForChoice = activateJokerCardEffect(p, copiedCard, joker);
    updateUI();
    if (!waitingForChoice) endTurn();
}

function activateJokerCardEffect(p, selectedCard, joker) {
    const card = { ...selectedCard, uid: joker.uid };
    log(`🃏【${joker.n}】發動了【${selectedCard.n}】的效果。`, 'effect');

    switch (card.id) {
        case 'CTHULHU':
        case 'DRAGON':
        case 'WEREWOLF':
        case 'HEADLESS':
        case 'MEDUSA':
        case 'WITCH':
        case 'GARGOYLE':
            resolveEffect(p, card);
            break;
        case 'PUMPKIN_KING':
            log(`🎃【南瓜王】的勝利需要與【骷髏】或【無頭騎士】同時打出；小丑複製效果不能代替配對打出。`, 'sys');
            break;
        case 'VAMPIRE':
            log(`🧛【吸血鬼】沒有可在面前區發動的效果。`, 'sys');
            break;
        case 'SEA_MONSTER':
            if (p.name === '你') {
                showSeaMonsterModal(p);
                return true;
            }
            resolveSeaMonsterForAI(p);
            break;
        case 'HELL_LORD':
            if (p.name === '你') {
                showHellLordModal(p, false);
                return true;
            }
            resolveHellLordForAI(p, false);
            break;
        case 'TROLL':
        case 'MUMMY':
            if (p.name === '你') {
                showCompareTargetModal(p, card);
                return true;
            }
            {
                const targets = state.players.filter(player =>
                    player.id !== p.id && targetableHandCards(player).length > 0 && !player.immune);
                if (targets.length > 0 && targetableHandCards(p).length > 0) {
                    const target = getAIStrategicTarget(p, targets);
                    executeCompare(p, target, card);
                } else {
                    log(`➔ 沒有可比較的目標（可能持有小丑或已免疫）。`, 'sys');
                }
            }
            break;
        case 'MINOTAUR':
            if (p.name === '你') {
                showMinotaurModal(p);
                return true;
            }
            {
                const targets = state.players.filter(player =>
                    player.id !== p.id && targetableHandCards(player).length > 0 && !player.immune);
                if (targets.length > 0 && targetableHandCards(p).length > 0) {
                    const target = getAIStrategicTarget(p, targets);
                    if (shouldAISwapHandCards(p, target)) {
                        const myCard = targetableHandCards(p)[0];
                        const targetCard = targetableHandCards(target)[0];
                        p.hand[p.hand.indexOf(myCard)] = targetCard;
                        target.hand[target.hand.indexOf(targetCard)] = myCard;
                        log(`🔄 ${p.name} 透過【牛頭人】效果與【${target.name}】交換手牌。`, 'effect');
                    } else {
                        log(`🚫 ${p.name} 決定不交換手牌。`, 'sys');
                    }
                }
                state.extraTurn = true;
            }
            break;
        case 'CHIMERA':
            if (p.name === '你') {
                showChimeraModal(p);
                return true;
            }
            {
                const targets = state.players.filter(player => !player.immune);
                if (targets.length > 0) {
                    const opponents = targets.filter(target => target.id !== p.id);
                    const target = getAIStrategicTarget(p, opponents.length > 0 ? opponents : targets);
                    executeChimeraEffect(target);
                }
            }
            break;
        case 'NIGHTMARE': {
            p.knownCenter = state.centerCards.map(c => c ? c.uid : null);
            p.knownReserves = state.reserves.map(c => c ? c.uid : null);
            log(`🌑 ${p.name} 透過【${joker.n}】查看了當下的暗牌區與備用牌；之後暗牌若被換走，夢魘不會知道新牌。`, 'nightmare');
            if (p.name === '你') {
                const knownCards = [...state.centerCards, ...state.reserves].filter(Boolean);
                const html = `<p>你查看了此刻的暗牌與備用牌。若暗牌之後被換走，你不會知道替換後的牌。</p>
                    <div style="display:flex; gap:10px; margin-top:15px; justify-content:center; flex-wrap:wrap;">
                        ${knownCards.map(c => renderCardFace(c, 'modal-card')).join('')}
                    </div>
                    <button onclick="closeModal(); updateUI(); endTurn();" style="width:100%; margin-top:15px; padding:10px; background:#10b981; border:none; border-radius:4px; color:white; font-weight:bold;">我知道了</button>`;
                showModal('夢魘的視野', html);
                return true;
            }
            break;
        }
        case 'NECROMANCER':
            if (p.name === '你') {
                showNecromancerModal(p);
                return true;
            }
            if (state.discard.length > 0) {
                const picked = state.discard.reduce((best, c, i, discard) =>
                    (c.v || 0) > (discard[best].v || 0) ? i : best, 0);
                const revived = state.discard.splice(picked, 1)[0];
                p.front.push(revived);
                log(`🧙 ${p.name} 透過【${joker.n}】復活了【${revived.n} (${revived.v})】。`, 'effect');
            } else {
                log(`🧙 ${p.name} 想發動【死靈法師】效果，但棄牌堆是空的。`, 'sys');
            }
            break;
        case 'SUCCUBUS':
            if (p.name === '你') {
                showSuccubusModal(p);
                return true;
            }
            {
                const targets = state.players.filter(player => player.id !== p.id && !player.immune);
                if (targets.length > 0) {
                    const target = getAIStrategicTarget(p, targets);
                    p.bindTo = target.id;
                    log(`💖 ${p.name} 的【魅魔】效果選擇了【${target.name}】，觸發共同勝利綁定。`, 'succubus');
                } else {
                    log(`💖 ${p.name} 的【魅魔】效果找不到目標（全員免疫）。`, 'sys');
                }
            }
            break;
        case 'FRANKENSTEIN':
            if (p.name === '你') {
                showModal('科學怪人的效果', `
                    <p>是否發動科學怪人效果，獲得額外回合？</p>
                    <div style="display:flex; gap:10px; margin-top:15px;">
                        <button onclick="confirmCopiedFrankenstein(true)" style="flex:1; padding:10px; background:#10b981; color:white; border:none; border-radius:4px;">獲得額外回合</button>
                        <button onclick="confirmCopiedFrankenstein(false)" style="flex:1; padding:10px; background:#475569; color:white; border:none; border-radius:4px;">不發動</button>
                    </div>
                `);
                return true;
            }
            state.extraTurn = true;
            state.skipFrankensteinOnce = true;
            log(`⚡ ${p.name} 複製【科學怪人】效果，獲得額外回合。`, 'target');
            break;
        case 'SANDWORM':
            if (p.name === '你') {
                showSandwormModal(p);
                return true;
            }
            {
                const targets = state.players.filter(player =>
                    player.id !== p.id && player.front.length > 0 && !player.immune);
                if (targets.length > 0) {
                    const target = getAIStrategicTarget(p, targets);
                    const selected = getAIStrategicFrontCard(target);
                    const stolen = target.front.splice(selected.index, 1)[0];
                    p.front.push(stolen);
                    log(`🃏 ${p.name} 透過【${joker.n}】發動【沙蟲】效果，從【${target.name}】奪取【${stolen.n}】。`, 'joker');
                } else {
                    log(`🃏 ${p.name} 的【沙蟲】效果沒有可奪取的目標。`, 'sys');
                }
            }
            break;
        case 'GHOST':
            if (p.name === '你') {
                showCopiedGhostEffect(p);
                return true;
            }
            {
                const targets = state.players.filter(player => player.front.length > 0);
                if (targets.length > 0) {
                    const opponents = targets.filter(target => target.id !== p.id);
                    const target = getAIStrategicTarget(p, opponents.length > 0 ? opponents : targets);
                    const selected = getAIStrategicFrontCard(target);
                    const moved = target.front.splice(selected.index, 1)[0];
                    p.front.push(moved);
                    log(`👻 ${p.name} 透過【${joker.n}】發動【幽靈】效果，移動了【${moved.n}】。`, 'sys');
                } else {
                    log(`👻【幽靈】效果沒有可移動的牌。`, 'sys');
                }
            }
            break;
        case 'ZOMBIE':
            if (p.name === '你') {
                showZombieModal(p, joker);
                return true;
            }
            {
                const targets = state.players.filter(player =>
                    getZombieDiscardOptions(player, p.id, joker.uid).length > 0 && !player.immune);
                if (targets.length > 0) {
                    const opponents = targets.filter(target => target.id !== p.id);
                    const target = getAIStrategicTarget(p, opponents.length > 0 ? opponents : targets);
                    const options = getZombieDiscardOptions(target, p.id, joker.uid);
                    const selected = options
                        .map(option => ({
                            ...option,
                            threatReduction: getAIThreatReduction(target, option.index)
                        }))
                        .sort((a, b) =>
                            b.threatReduction - a.threatReduction ||
                            (b.card.v || 0) - (a.card.v || 0))[0];
                    const removed = target.front.splice(selected.index, 1)[0];
                    putToDiscard(removed, `${target.name} 因【喪屍】效果被迫棄掉面前的牌`);
                } else {
                    log(`🧟 ${p.name} 的【喪屍】效果找不到目標。`, 'sys');
                }
            }
            break;
        case 'SKELETON':
            if (p.name === '你') {
                showSkeletonModal(p);
                return true;
            }
            {
                const targets = state.players.filter(player =>
                    player.id !== p.id && targetableHandCards(player).length > 0 && !player.immune);
                if (targets.length > 0) {
                    const target = getAIStrategicTarget(p, targets);
                    const targetCard = targetableHandCards(target)[0];
                    const guess = Math.floor(Math.random() * 14);
                    log(`💀 ${p.name} 的【骷髏】猜測【${target.name}】的手牌是 ${guess}。`, 'skeleton');
                    if (targetCard.v === guess) {
                        target.hand.splice(target.hand.indexOf(targetCard), 1);
                        p.front.push(targetCard);
                        const drawn = forceDraw(target, false);
                        if (drawn) target.hand.push(drawn);
                        log(`✅ 猜測成功，${p.name} 將【${targetCard.n}】放到自己面前。`, 'skeleton');
                    } else {
                        log(`❌ 猜測失敗！`, 'skeleton');
                    }
                } else {
                    log(`💀 ${p.name} 的【骷髏】效果沒有可猜測的目標。`, 'sys');
                }
            }
            break;
    }
    return false;
}

function showSeaMonsterModal(p) {
    if (state.deck.length === 0) {
        log(`🌊 ${p.name} 的【海怪】查看牌堆頂，但牌堆已空，效果不發動。`, 'sys');
        endTurn();
        return;
    }

    const revealed = state.deck.pop();
    if (p.hand.length === 0) {
        state.deck.push(revealed);
        log(`🌊 ${p.name} 的【海怪】查看了牌堆頂的【${revealed.n}】，但沒有手牌可交換；牌放回牌堆頂。`, 'sys');
        updateUI();
        endTurn();
        return;
    }

    state.pendingSeaMonsterCard = { playerId: p.id, card: revealed };
    const handChoices = p.hand.map((handCard, index) => `
        <button onclick="confirmSeaMonsterSwap(${index})" style="padding:8px; background:#3b4754; color:white; border:none; border-radius:4px; cursor:pointer;">
            與【${handCard.n} (${handCard.v})】交換
        </button>
    `).join('');
    showModal('海怪查看牌堆頂', `
        <p>牌堆頂是以下這張牌：</p>
        <div style="display:flex; justify-content:center; margin:10px;">${renderCardFace(revealed, 'modal-card')}</div>
        <p>選擇是否與一張手牌交換：</p>
        <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">${handChoices}</div>
        <button onclick="confirmSeaMonsterSwap(-1)" style="width:100%; margin-top:12px; padding:10px; background:#475569; color:white; border:none; border-radius:4px; cursor:pointer;">不交換，放回牌堆頂</button>
    `);
}

function confirmSeaMonsterSwap(handIndex) {
    const pending = state.pendingSeaMonsterCard;
    const p = state.players.find(player => player.id === pending?.playerId);
    if (!pending || !p || state.players[state.currentTurn]?.id !== p.id) {
        log(`🌊 海怪效果取消：待交換的牌或玩家已不存在。`, 'sys');
        state.pendingSeaMonsterCard = null;
        closeModal();
        updateUI();
        return;
    }

    if (handIndex >= 0 && p.hand[handIndex]) {
        const returned = p.hand[handIndex];
        p.hand[handIndex] = pending.card;
        state.deck.push(returned);
        log(`🌊 ${p.name} 的【海怪】將牌堆頂的【${pending.card.n}】與手牌【${returned.n}】交換；原手牌放到牌堆頂。`, 'effect');
    } else {
        state.deck.push(pending.card);
        log(`🌊 ${p.name} 的【海怪】將【${pending.card.n}】放回牌堆頂。`, 'sys');
    }

    state.pendingSeaMonsterCard = null;
    closeModal();
    updateUI();
    endTurn();
}

function resolveSeaMonsterForAI(p) {
    if (state.deck.length === 0) {
        log(`🌊 ${p.name} 的【海怪】效果不發動，因為牌堆已空。`, 'sys');
        return;
    }

    const revealed = state.deck.pop();
    if (p.hand.length > 0 && Math.random() < 0.5) {
        const handIndex = Math.floor(Math.random() * p.hand.length);
        const returned = p.hand[handIndex];
        p.hand[handIndex] = revealed;
        state.deck.push(returned);
        log(`🌊 ${p.name} 的【海怪】查看牌堆頂並與手牌【${returned.n}】交換。`, 'effect');
    } else {
        state.deck.push(revealed);
        log(`🌊 ${p.name} 的【海怪】查看牌堆頂後選擇不交換。`, 'sys');
    }
}

    if(validTargets.length === 0) {

    showModal('奇美拉的凝視', `

            ${validTargets.map(t => `<button onclick="confirmChimera(${t.id})" style="padding:10px 20px; background:#f97316; color:white; border:none; border-radius:4px; cursor:pointer;">${t.name}</button>`).join('')}
        </div>

function confirmChimera(targetId) {
    const p = state.players[state.currentTurn];
    const target = state.players.find(x => x.id === targetId);
    
    log(`🦁 ${p.name} 的【奇美拉】選擇了【${target.name}】。`, 'chimera');
    closeModal();
    executeChimeraEffect(target);
    updateUI();
    endTurn();
}

function executeChimeraEffect(target) {
    if (target.immune) {
        log(`　- ${target.name} 獲得【石像鬼】免疫，不受影響。`, 'immune');
        return;
    }
    
    const handCards = targetableHandCards(target);
    if (handCards.length > 0) {
        target.hand = target.hand.filter(isJokerCard);
        target.front.push(...handCards);
        log(`➔ ${target.name} 將手牌 [${handCards.map(c=>c.n).join(', ')}] 放到了面前區。`, 'chimera');
    }

    if (target.hand.length === 0) {
        const drawn = forceDraw(target, false);
        if (drawn) {
            target.hand.push(drawn);
            log(`➔ ${target.name} 從牌庫重抽了 1 張牌。`, 'chimera');
        }
    }
}

        <div style="display:flex; gap:10px; justify-content:center;">

        </div>
    `);
}

function confirmSkeletonGuess() {
    const p = state.players[state.currentTurn];
    const targetId = parseInt(document.getElementById('skel-target').value);
    const guessVal = parseInt(document.getElementById('skel-guess').value);
    const target = state.players.find(x => x.id === targetId);
    
    log(`💀 ${p.name} 的【骷髏】猜測了【${target.name}】的手牌是 ${guessVal}。`, 'skeleton');
    
    const targetCard = targetableHandCards(target)[0];
    if (targetCard && targetCard.v === guessVal) {
        log(`✅ 猜測成功！${p.name} 將【${target.name}】的手牌搶到了自己面前。`, 'skeleton');
        const stolen = target.hand.splice(target.hand.indexOf(targetCard), 1)[0];
        p.front.push(stolen);
        const drawn = forceDraw(target, false);
        if (drawn) {
            target.hand.push(drawn);
            log(`➔ ${target.name} 被猜中手牌，從牌庫抽了 1 張牌補回手牌。`, 'skeleton');
        }
    } else {
        log(`❌ 猜測失敗！【${target.name}】的手牌不是 ${guessVal}。`, 'skeleton');
    }
    
    closeModal();
    updateUI();
    endTurn();
}

// --- 結束回合與換人 ---
function endTurn() {
    if (state.gameOver) return;

    const p = state.players[state.currentTurn];
    
    const hasFrankenstein = !state.skipFrankensteinOnce && p.front.some(c => c.id === 'FRANKENSTEIN');
    state.skipFrankensteinOnce = false;
    if (hasFrankenstein) {
        if (p.name === '你') {
            endTurnWithFrankenstein(p);
            return; 
        } else {
            if (Math.random() > 0.5) {
                log(`🤖 ${p.name} 決定棄掉面前的【科學怪人】，獲得額外回合！`, 'win');
                const idx = p.front.findIndex(c => c.id === 'FRANKENSTEIN');
                const removed = p.front.splice(idx, 1)[0];
                putToDiscard(removed, `${p.name} 棄掉面前的【科學怪人】`);
                state.extraTurn = true;
            } else {
                log(`🤖 ${p.name} 決定保留【科學怪人】在面前。`);
            }
        }
    }

    if (!state.extraTurn) {
        state.currentTurn = (state.currentTurn + 1) % state.players.length;
    } else {
        log(`✨ ${state.players[state.currentTurn].name} 獲得額外回合！`, 'win');
        state.extraTurn = false;
    }
    
    state.uiState = 'DRAW_PHASE'; 
    updateUI();

    if (state.players[state.currentTurn].name !== '你') {
        state.waitForPlayerAck = true;
        document.getElementById('turn-indicator').innerText = `等待確認...`;
        document.getElementById('global-controls').innerHTML = `
            <button onclick="acknowledgeAI()" style="background:#10b981; padding:12px 24px; font-size:16px; border-radius:8px;">👉 點擊繼續 (輪到 ${state.players[state.currentTurn].name})</button>
        `;
    } else {
        setTimeout(startTurn, 500);
    }
}

function acknowledgeAI() {
    state.waitForPlayerAck = false;
    document.getElementById('global-controls').innerHTML = '';
    startTurn();
}

// --- 牌庫抽完結算 ---
function checkDeckEmpty() {
    let cthulhuPlayer = null;
    state.players.forEach(p => {
        const hasCthulhu = p.hand.some(c => c.id === 'CTHULHU');
        if (hasCthulhu) cthulhuPlayer = p;
    });

    if (cthulhuPlayer) {
        declareWinner(cthulhuPlayer, `牌庫抽完！${cthulhuPlayer.name} 持有【克蘇魯】，獲得勝利！`);
        return;
    }

    const ghostPlayer = state.players.find(p => p.hand.some(c => c.id === 'GHOST'));
    if (ghostPlayer) {
        state.pendingGhost = ghostPlayer;
        log(`👻 牌庫抽完！${ghostPlayer.name} 持有【幽靈】，可以移動面前區的一張牌！`, 'sys');
        if (ghostPlayer.name === '你') {
            showGhostModal(ghostPlayer);
        } else {
            const validPlayers = state.players.filter(x => x.front.length > 0);
            if (validPlayers.length > 0) {
                const targetP = validPlayers[Math.floor(Math.random() * validPlayers.length)];
                const cardIdx = Math.floor(Math.random() * targetP.front.length);
                const moved = targetP.front.splice(cardIdx, 1)[0];
                ghostPlayer.front.push(moved);
                log(`👻 ${ghostPlayer.name} 的【幽靈】隨機將【${targetP.name}】面前的【${moved.n}】移動到了自己面前。`, 'sys');
            }
            finishDeckEmptySettlement();
        }
        return;
    }

    finishDeckEmptySettlement();
}

    html += `<div style="display:flex; flex-direction:column; gap:10px; margin-top:15px; max-height:300px; overflow-y:auto;">`;

function finishDeckEmptySettlement() {
    state.pendingGhost = null;
    
    // 現版本：牌庫抽完後一律以總點數最高者獲勝（夢魘不再改寫結算）
    let targetScore = -1; 
    let winner = null;
    let scoresText = [];
    
    state.players.forEach(p => {
        const baseFrontScore = p.front.reduce((sum, c) => sum + (c.v || 0), 0);
        const alienBonus = p.hand.some(c => c.id === 'ALIEN') ? p.front.length * 2 : 0;
        const frontScore = baseFrontScore + alienBonus;
        const handScore = p.hand.reduce((sum, c) => sum + (c.v || 0), 0);
        const totalScore = frontScore + handScore;
        
        scoresText.push(`${p.name}：面前 ${baseFrontScore}${alienBonus ? ` + 外星人加成 ${alienBonus}` : ''} + 手牌 ${handScore} = ${totalScore} 點`);
        
        if (totalScore > targetScore) { targetScore = totalScore; winner = p; }
    });
    
    log(`🏆 結算全場總點數 (面前+手牌)：`, 'win');
    log(`📊 ${scoresText.join(' | ')}`, 'sys');
    
    if (winner) {
        declareWinner(winner, `${winner.name} 總點數是 ${targetScore}，獲得勝利！`);
    }
}

// --- AI 邏輯 ---
function aiTurn() {
    if (state.gameOver) return;
    const p = state.players[state.currentTurn];
    
    const availableCenterSlots = state.centerCards
        .map((card, index) => card ? index : -1)
        .filter(index => index !== -1);
    if (p.hand.length === 1 && !p.hand.some(c => c.id === 'PUMPKIN_KING') &&
        availableCenterSlots.length > 0 && Math.random() < 0.25) {
        aiTakeCenter(p, availableCenterSlots);
        return;
    }

    if (p.hand.length < 2 && state.deck.length > 0) {
        const result = drawCardLogic(p, true);
        if (!result) {
            checkDeckEmpty();
            return;
        }
        if (result.isItem) {
            state.extraTurn = false;
            updateUI();
            if (state.deck.length === 0) {
                checkDeckEmpty();
            } else {
                setTimeout(aiTurn, 600);
            }
            return;
        }
        if (result.card) {
            p.hand.push(result.card);
            log(`${p.name} 抽了一張牌。`, 'sys');
            updateUI();
        }
    }
    
    setTimeout(() => {
        if (state.gameOver) return;
        if (p.hand.length > 0) {
            const hasPumpkinKing = p.hand.some(c => c.id === 'PUMPKIN_KING');
            const pkIndex = p.hand.findIndex(c => c.id === 'PUMPKIN_KING');
            const skeletonIdx = p.hand.findIndex(c => c.id === 'SKELETON');
            const headlessIdx = p.hand.findIndex(c => c.id === 'HEADLESS');
            const hasCompanion = skeletonIdx >= 0 || headlessIdx >= 0;
            const pumpkinAppeared = state.discard.some(c => c.id === 'PUMPKIN');

            if (hasPumpkinKing) {
                // 有同伴時優先一起打出（尤其已出現南瓜可獲勝，或隨機偏好一起）
                if (hasCompanion && (pumpkinAppeared || Math.random() < 0.7)) {
                    const compIdx = skeletonIdx >= 0 ? skeletonIdx : headlessIdx;
                    playCard(pkIndex, true, compIdx);
                } else {
                    // 只打出南瓜王
                    playCard(pkIndex, false);
                }
            } else {
                const winIdx = p.hand.findIndex(c => checkVictoryCondition(p, c));
                const attackIdx = getAIAttackCardIndex(p);
                const idx = winIdx !== -1 ? winIdx :
                    (attackIdx !== -1 ? attackIdx : Math.floor(Math.random() * p.hand.length));
                playCard(idx);
            }
        } else {
            endTurn();
        }
    }, 400);
}

function aiTakeCenter(p, availableSlots) {
    const index = availableSlots[Math.floor(Math.random() * availableSlots.length)];
    const taken = state.centerCards[index];
    const canSummonVampire = state.discard.some(c => c.id === 'BLOOD') && p.front.reduce((s, c) => s + (c.v || 0), 0) === 0;

    if (taken.id === 'VAMPIRE') {
        if (canSummonVampire) {
            declareWinner(p, `${p.name} 在【鮮血】出現後，且面前無牌，成功從暗牌召喚出【吸血鬼】，獲得勝利！`);
        } else {
            log(`⚠️ ${p.name} 拿走了【吸血鬼】，但未達成召喚條件，必須將它放回暗牌區！`, 'sys');
            endTurn();
        }
        return;
    }

    state.centerCards[index] = null;
    p.hand.push(taken);
    const returnableIndices = p.hand
        .map((card, cardIndex) => card.id === 'PUMPKIN_KING' ? -1 : cardIndex)
        .filter(cardIndex => cardIndex !== -1);
    const returnIndex = returnableIndices[Math.floor(Math.random() * returnableIndices.length)];
    const returned = p.hand.splice(returnIndex, 1)[0];
    state.centerCards[index] = returned;

    logSys(`${p.name} 從暗牌區拿了一張牌，並將【${returned.n}】放回暗牌區。`);
    updateUI();
    endTurn();
}

        const hasPumpkinKing = p.id === state.currentTurn && p.hand.some(c => c.id === 'PUMPKIN_KING');
        
        const totalScore = p.front.reduce((sum, c) => sum + (c.v || 0), 0);
        
        const tenpai = getTenpaiInfo(p);
        // 美杜莎叫糊只顯示在當前回合的玩家；外星人已排除「僅因美杜莎而叫糊」的情況
        const displayTenpai = (p.id === state.currentTurn)
            ? tenpai
            : tenpai.filter(n => n !== '美杜莎');
        const tenpaiHtml = displayTenpai.length > 0 
            ? `<div class="tenpai-badge">🔥 叫糊</div>
               <div class="tenpai-text">等待：${displayTenpai.map(n => `<span onclick="showCardInfoByName('${n}')" style="cursor:pointer; text-decoration:underline; margin:0 2px;" title="點擊查看說明">${n}</span>`).join('、')}</div>` 
            : '';
        const tenpaiCards = new Set(displayTenpai);
        const holdsPumpkinKing = p.hand.some(card => card.id === 'PUMPKIN_KING');
        const hasPairCompanion = holdsPumpkinKing &&
            p.hand.some(card => card.id === 'SKELETON' || card.id === 'HEADLESS');
        const handHtml = p.hand.map(card => {
            const canPlayWithPumpkinKing = !holdsPumpkinKing ||
                ['PUMPKIN_KING', 'SKELETON', 'HEADLESS'].includes(card.id);
            const pairedWin = hasPairCompanion &&
                (card.id === 'PUMPKIN_KING' || card.id === 'SKELETON' || card.id === 'HEADLESS') &&
                state.discard.some(discarded => discarded.id === 'PUMPKIN');
            const canWin = canPlayWithPumpkinKing && (checkVictoryCondition(p, card) || pairedWin);
            
            // 計算打出後會叫什麼糊（直接獲勝優先，不顯示綠色）
            // 若已經有叫糊，只有出現「新的」叫糊組合才顯示綠色
            let afterTenpai = [];
            let enablesTenpai = false;
            if (!canWin && canPlayWithPumpkinKing) {
                afterTenpai = getTenpaiAfterPlaying(p, card);
                const currentSet = new Set(displayTenpai);
                const hasNewTenpai = afterTenpai.some(n => !currentSet.has(n));
                enablesTenpai = afterTenpai.length > 0 && (displayTenpai.length === 0 || hasNewTenpai);
            }
            
            const cardClass = canWin ? 'hand-win' : enablesTenpai ? 'hand-tenpai' : '';
            const afterListStr = enablesTenpai ? afterTenpai.join('、') : '';
            
            // 自訂點擊：有會叫糊時同時顯示叫糊資訊 + 原本說明
            const suit = card.suit || '';
            const symbol = SUIT_SYMBOLS[suit] || '';
            const jokerClass = card.id === 'RED_JOKER' ? 'red-joker' : card.id === 'BLUE_JOKER' ? 'blue-joker' : '';
            const forcedClass = hasPumpkinKing && card.id === 'PUMPKIN_KING' ? 'forced' : '';
            const clickHandler = enablesTenpai
                ? `showCardInfoWithTenpai('${card.id}', '${afterListStr}')`
                : `showCardInfo('${card.id}')`;
            
            return `<div class="card ${suit ? `suit-${suit}` : ''} ${jokerClass} ${cardClass} ${forcedClass}" onclick="${clickHandler}" style="cursor:pointer;" title="${enablesTenpai ? '打出後會叫糊：' + afterListStr : '點擊查看說明'}">
                <div class="num">${card.v ?? ''}</div>
                <div class="name">${symbol ? `<span class="suit-symbol">${symbol}</span>` : ''}${card.n}</div>
            </div>`;
        }).join('');

        return `
        <div class="player-box ${p.name === '你' ? 'me' : ''}">
            ${tenpaiHtml}
            <h3>${p.name} ${p.immune ? '🛡️免疫' : ''} <span>總點數: ${totalScore}</span></h3>
            ${bindText}
            <div class="area-title">手牌 (${p.hand.length})</div>
            <div class="cards-container">${handHtml}</div>
            <div class="area-title">面前區 (${p.front.length})</div>
            <div class="cards-container">${(() => {
                const contrib = getContributingFrontUids(p.front, displayTenpai);
                return p.front.map(c => renderCardFace(c, [
                    p.immune ? 'immune-card' : '',
                    contrib.has(c.uid) ? 'front-tenpai' : ''
                ].filter(Boolean).join(' '))).join('');
            })()}</div>
        </div>
    `}).join('');
    
    if (!state.waitForPlayerAck && !state.pendingGhost) {
        document.getElementById('turn-indicator').innerText = `牌庫剩餘: ${state.deck.length} | 棄牌堆: ${state.discard.length} | 暗牌剩餘: ${state.centerCards.filter(Boolean).length}`;
    }
}

function showModal(title, content, options = {}) {
    // options.cancelText, options.onCancel (function name string or false to hide)
    const cancelText = options.cancelText !== undefined ? options.cancelText : '返回';
    const onCancel = options.onCancel !== undefined ? options.onCancel : 'closeModalAndEndTurn()';
    const cancelBtn = onCancel === false ? '' :
        `<button onclick="${onCancel}" style="width:100%; margin-top:12px; padding:10px; background:#475569; color:white; border:none; border-radius:4px; cursor:pointer;">${cancelText}</button>`;
    document.getElementById('modal-container').innerHTML = `<div class="modal"><div class="modal-content"><h3 style="color:#f59e0b; margin-top:0;">${title}</h3>${content}${cancelBtn}</div></div>`;
}
function closeModalAndEndTurn() {
    closeModal();
    state.waitForDiscardChoice = false;
    if (!state.gameOver) {
        updateUI();
        endTurn();
    }
}
function showCardInfo(cardId) {
    const guide = CARD_GUIDE.find(c => c.id === cardId);
    if (!guide) {
        showModal('卡牌說明', `<p>找不到此牌的詳細說明。</p>`, { cancelText: '關閉', onCancel: 'closeModal()' });
        return;
    }
    showModal(guide.n, `
        <p><strong>勝利條件：</strong>${guide.victory}</p>
        <p><strong>打出效果：</strong>${guide.effect}</p>
    `, { cancelText: '關閉', onCancel: 'closeModal()' });
}
function showCardInfoWithTenpai(cardId, afterTenpaiStr) {
    const guide = CARD_GUIDE.find(c => c.id === cardId);
    if (!guide) {
        showModal('卡牌說明', `<p>找不到此牌的詳細說明。</p>`, { cancelText: '關閉', onCancel: 'closeModal()' });
        return;
    }
    showModal(guide.n, `
        <div style="background:rgba(34,197,94,0.15); border:1px solid #22c55e; border-radius:6px; padding:10px; margin-bottom:12px;">
            <p style="margin:0; color:#4ade80; font-weight:bold;">🟢 打出後會叫糊：</p>
            <p style="margin:6px 0 0; color:#dcfce7; font-size:15px;">${afterTenpaiStr || '無'}</p>
        </div>
        <p><strong>勝利條件：</strong>${guide.victory}</p>
        <p><strong>打出效果：</strong>${guide.effect}</p>
    `, { cancelText: '關閉', onCancel: 'closeModal()' });
}
function showCardInfoByName(name) {
    const guide = CARD_GUIDE.find(c => c.n === name);
    if (guide) showCardInfo(guide.id);
    else showModal('卡牌說明', `<p>找不到「${name}」的詳細說明。</p><button onclick="closeModal()" style="width:100%; margin-top:10px; padding:10px; background:#475569; color:white; border:none; border-radius:4px;">關閉</button>`);
}
function showCardGuide() {
    const entries = CARD_GUIDE.map(card => `
        <section class="card-guide-entry">
            <h4>${card.n}</h4>
            <p><strong>勝利條件：</strong>${card.victory}</p>
            <p><strong>打出效果：</strong>${card.effect}</p>
        </section>
    `).join('');
    showModal('卡牌說明', `
        <p>包含怪物牌、道具牌與小丑牌。</p>
        ${entries}
        <button onclick="closeModal()" style="width:100%; margin-top:10px; padding:10px; background:#475569; color:white; border:none; border-radius:4px;">關閉</button>
    `);
}
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

// 啟動
initGame();
</script>
</body>
</html>
